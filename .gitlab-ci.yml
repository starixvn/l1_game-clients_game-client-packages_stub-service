.docker-build:
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  tags:
    - docker
  stage: build
  before_script:
    - export CI_REGISTRY_IMAGE=$DOCKER_REG_LOCAL_URL/pentagon/game-clients/stub-service
    - |
      kaniko_config_file=/kaniko/.docker/config.json
      if [[ ! -f "$kaniko_config_file" ]]; then
      echo "No $kaniko_config_file found! Creating one now."
      cat << END_CONFIGS >> $kaniko_config_file
      {
        "auths" : {
          "${DOCKER_REG_LOCAL_URL}": {
            "auth": "$(printf "%s:%s" "${DOCKER_REG_LOCAL_USERNAME}" "${DOCKER_REG_LOCAL_PASSWORD}" | base64 | tr -d '\n')"
          }
        }
      }
      END_CONFIGS
      fi
  script:
    - /kaniko/executor
      --context .
      --dockerfile Dockerfile
      --destination "$CI_REGISTRY_IMAGE"
  after_script:
    - |
      kaniko_config_file=/kaniko/.docker/config.json
      rm $kaniko_config_file

integration-test:
  before_script:
    - docker run -d -p 9999:80 --name client hub.lumigame.com/pentagon/l1_game_client_base:LOCAL_3-latest
    - docker run -d -p 8080:8080 --name service hub.lumigame.com/pentagon/game-clients/stub-service
  script:
    - npm install
    - npm test
  after_script:
    - docker rm -f -v client service
  tags:
    - docker
    - windows

variables:
  CI_DEBUG_SERVICES: "true"
  DATA_DIR: /build/data
  CLIENT_URL: "http://client/?token=x&lang=vi-VN"
  CLIENT_CONFIGS: |-
    window.envConfig = {
      isDev: false,
      systemType: "SC1",
      ssl: false,
      serverDomainMapper: {
        client: "service:8080",
      },
      subDomain: "",
      env: "LOCAL",
      subGuideDomain: "l1-guide",
      enableMsgpackParserAllGames: false,
      enableMsgpackParserOnNotification: false,
      userServiceUrlDev: "http://service:8080/",
      proxyRoute: "",
      wsPath: "sedie",
    };
