.docker-build:
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  tags:
    - docker
  stage: build
  before_script:
    - export CI_REGISTRY_IMAGE=$DOCKER_REG_LOCAL_URL/pentagon/game-clients/stub-service
    - |
      kaniko_config_file=/kaniko/.docker/config.json
      if [[ ! -f "$kaniko_config_file" ]]; then
      echo "No $kaniko_config_file found! Creating one now."
      cat << END_CONFIGS >> $kaniko_config_file
      {
        "auths" : {
          "${DOCKER_REG_LOCAL_URL}": {
            "auth": "$(printf "%s:%s" "${DOCKER_REG_LOCAL_USERNAME}" "${DOCKER_REG_LOCAL_PASSWORD}" | base64 | tr -d '\n')"
          }
        }
      }
      END_CONFIGS
      fi
  script:
    - /kaniko/executor
      --context .
      --dockerfile Dockerfile
      --destination "$CI_REGISTRY_IMAGE"
  after_script:
    - |
      kaniko_config_file=/kaniko/.docker/config.json
      rm $kaniko_config_file

integration-test:
  before_script:
    - docker rm -f -v client service
    - |
      $CLIENT_CONFIGS = @"
      window.envConfig = {
        isDev: false,
        systemType: "SC1",
        ssl: false,
        serverDomainMapper: {
          localhost: "localhost:8080",
        },
        subDomain: "",
        env: "LOCAL",
        subGuideDomain: "l1-guide",
        enableMsgpackParserAllGames: false,
        enableMsgpackParserOnNotification: false,
        userServiceUrlDev: "http://localhost:8080/",
        proxyRoute: "",
        wsPath: "sedie",
      };
      "@

    - echo $CLIENT_CONFIGS > c.js
    - cat c.js
    - docker run -d -p 9999:80 -v .:/usr/share/nginx/html/c --name client-$CI_COMMIT_SHORT_SHA hub.lumigame.com/pentagon/l1_game_client_base:LOCAL_3-latest
    - docker run -d -p 8080:8080 --name service-$CI_COMMIT_SHORT_SHA hub.lumigame.com/pentagon/game-clients/stub-service
  script:
    - npm install
    - npm test
  after_script:
    - docker rm -f -v client-$CI_COMMIT_SHORT_SHA service-$CI_COMMIT_SHORT_SHA
  tags:
    - docker
    - windows

variables:
  NAMESPACES: "/,/user/sedie"
  DATA_DIR: /build/data
  CLIENT_URL: "http://localhost:9999/?token=x&lang=vi-VN"
