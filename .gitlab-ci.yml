docker-build:
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  tags:
    - docker
  stage: build
  before_script:
    - export CI_REGISTRY_IMAGE=$DOCKER_REG_LOCAL_URL/pentagon/game-clients/stub-service
    - |
      kaniko_config_file=/kaniko/.docker/config.json
      if [[ ! -f "$kaniko_config_file" ]]; then
      echo "No $kaniko_config_file found! Creating one now."
      cat << END_CONFIGS >> $kaniko_config_file
      {
        "auths" : {
          "${DOCKER_REG_LOCAL_URL}": {
            "auth": "$(printf "%s:%s" "${DOCKER_REG_LOCAL_USERNAME}" "${DOCKER_REG_LOCAL_PASSWORD}" | base64 | tr -d '\n')"
          }
        }
      }
      END_CONFIGS
      fi
  script:
    - /kaniko/executor
      --context .
      --dockerfile Dockerfile
      --destination "$CI_REGISTRY_IMAGE"
  after_script:
    - |
      kaniko_config_file=/kaniko/.docker/config.json
      rm $kaniko_config_file

integration-test:
  before_script:
    - $SERVICE_IMAGE="hub.lumigame.com/pentagon/game-clients/stub-service"
    - $CLIENT_IMAGE="hub.lumigame.com/pentagon/l1_game_client_base:LOCAL_3-latest"
    - docker pull $SERVICE_IMAGE
    - docker pull $CLIENT_IMAGE
    - docker rm -f -v client-$CI_COMMIT_SHORT_SHA service-$CI_COMMIT_SHORT_SHA
    - |
      $CLIENT_PORT=$CI_JOB_ID % 64551 + 1024
      $CLIENT_CONFIGS = @"
      window.envConfig = {
        isDev: false,
        systemType: "SC1",
        ssl: false,
        serverDomainMapper: {
          localhost: "localhost:$($CLIENT_PORT + 1)",
        },
        subDomain: "",
        env: "LOCAL",
        subGuideDomain: "l1-guide",
        enableMsgpackParserAllGames: false,
        enableMsgpackParserOnNotification: false,
        userServiceUrlDev: "http://localhost:$($CLIENT_PORT + 1)/",
        proxyRoute: "",
        wsPath: "sedie",
      };
      "@

      $CLIENT_URL="http://localhost:$CLIENT_PORT/?token=x&lang=vi-VN"
      echo $CLIENT_CONFIGS > c.js
      cat c.js
      docker run -d -p "$CLIENT_PORT:80" -v .:/usr/share/nginx/html/c --name client-$CI_COMMIT_SHORT_SHA  $CLIENT_IMAGE
      docker run -d -p "$($CLIENT_PORT + 1):8080" --name service-$CI_COMMIT_SHORT_SHA $SERVICE_IMAGE
  script:
    - echo $CLIENT_URL
    - npm install
    - npm test
  after_script:
    - docker rm -f -v client-$CI_COMMIT_SHORT_SHA service-$CI_COMMIT_SHORT_SHA
  tags:
    - docker
    - windows

variables:
  NAMESPACES: "/,/user/sedie"
  DATA_DIR: /build/data
